pid /tmp/nginx/nginx.pid;
worker_processes 1;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;
  client_max_body_size 20m;

  server {
    listen __PORT__;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 1800s;
    proxy_buffering off;

    # Called by the FraudOps app: open, no login
    location /webhook/ { proxy_pass http://127.0.0.1:5678; }
    location = /healthz { proxy_pass http://127.0.0.1:5678; }

    # n8n editor and its API: login required only when start.sh keeps the auth_basic lines
    location / {
      auth_basic "n8n editor";
      auth_basic_user_file /tmp/nginx/htpasswd;
      proxy_pass http://127.0.0.1:5678;
    }
  }
}
